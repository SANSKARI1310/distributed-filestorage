server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/filestorage
    username:  ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate # Flyway handles schema creation, Hibernate only validates
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
  
  logging:
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB       # Rotate the log file when it reaches 10MB
      max-history: 7            # Keep 7 days of historical logs
      total-size-cap: 100MB     # Delete oldest logs if the total folder size exceeds 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
         include: readinessState,db,minio


  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true


minio:
  url: http://localhost:9000
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSOWORD}
  bucket-name: platform-bucket