server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/filestorage
    username: filestorage
    password: testlocalDB
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate # Flyway handles schema creation, Hibernate only validates
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: testlocalFile
  bucket-name: platform-bucket