server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/filestorage
    username: filestorage
    password: testlocalDB
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate # Flyway handles schema creation, Hibernate only validates
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
  
  logging:
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB       # Rotate the log file when it reaches 10MB
      max-history: 7            # Keep 7 days of historical logs
      total-size-cap: 100MB     # Delete oldest logs if the total folder size exceeds 100MB

minio:
  url: http://localhost:9000
  access-key: filestorageadmin
  secret-key: testlocalFile
  bucket-name: platform-bucket