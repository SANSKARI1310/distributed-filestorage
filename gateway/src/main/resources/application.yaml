
server:
  port: 8080

spring:
  application:
    name: platform-gateway

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      routes:
        - id: file-core-service
          uri: lb://core-file-service
          predicates:
            - Path=/api/v1/files/**

    discovery:
      client:
        simple:
          instances:
            core-file-service:
              - uri: http://localhost:8081
              - uri: http://localhost:8082

    loadbalancer:
      health-check:
        initial-delay: 2s
        interval: 5s
        path:
          default: /actuator/health/readiness
        refetch-instances: true
        refetch-instances-interval: 10s
        repeat-health-check: false

logging:
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

scheduler:
  dwrr:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: platform-gateway
